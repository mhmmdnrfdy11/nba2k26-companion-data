name: Refresh NBA 2K26 Cloud Master
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install requests beautifulsoup4 lxml
      - name: Scrape and rebuild master database
        run: python tools/refresh_database.py
      - name: Commit refreshed database
        run: |
          git config user.name 'nba2k26-cloud-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git diff --cached --quiet || git commit -m "chore: refresh NBA 2K26 master database"
          git push
